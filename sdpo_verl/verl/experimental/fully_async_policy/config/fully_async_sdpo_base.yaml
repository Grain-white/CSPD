# Shared async SDPO settings (child config — no hydra.searchpath here).
defaults:
  - fully_async_ppo_trainer
  - user
  - _self_

max_model_len: 18944

actor_rollout_ref:
  hybrid_engine: False
  actor:
    ppo_mini_batch_size: 32
    policy_loss:
      loss_mode: sdpo
    self_distillation:
      max_reprompt_len: 10240
      is_clip: 2.0
    optim:
      lr: 1e-5
  rollout:
    n: 8
    mode: async
    calculate_log_probs: True

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: False
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0

data:
  train_batch_size: 0
  gen_batch_size: 1

trainer:
  n_gpus_per_node: 2
  val_before_train: False

rollout:
  n_gpus_per_node: 2
  total_rollout_steps: 3200
  test_freq: 5

async_training:
  staleness_threshold: 0.5
  trigger_parameter_sync_step: 4
  require_batches: 1
  partial_rollout: True
  use_rollout_log_probs: True
  compute_prox_log_prob: False
  use_trainer_do_validate: False
